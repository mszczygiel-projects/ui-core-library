# Publishes the documentation site from main to GitHub Pages, where the Figma components link to
# their pages. Storybook writes relative paths, so the site works under the repository's path.
# Actions are pinned to full commit SHAs, with the release named in a comment.
name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a running one finishes, so the site is never half replaced.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LEFTHOOK: '0'
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm nx run storybook:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/storybook/storybook-static

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
