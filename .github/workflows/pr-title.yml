# Pull requests are squashed, and the title becomes the commit on main from
# which the release notes are generated, so the title follows Conventional
# Commits with the same types as the commit-msg hook.
name: Pull request title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          # The summary starts with a lowercase letter, as in the commits.
          subjectPattern: ^[^A-Z].+$
