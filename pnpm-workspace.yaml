packages:
  - packages/*
  - apps/*
  - testing/*
  - tools/*

# Every external dependency is declared once, in this catalog, and projects
# reference it with `catalog:`. Tooling is pinned to exact versions; an upgrade
# is a deliberate commit.
catalogMode: strict
catalog:
  '@arethetypeswrong/cli': 0.18.5
  '@eslint-react/eslint-plugin': 5.28.2
  '@eslint/js': 10.0.1
  # Publishes and checks the Code Connect templates of both frameworks.
  '@figma/code-connect': 2.0.2
  # Places the popup of a list next to its field, flipped and resized to fit the window.
  '@floating-ui/dom': 1.8.0
  '@fontsource/inter': 5.3.0
  '@nx/eslint': 24.0.1
  '@nx/devkit': 24.0.1
  '@nx/eslint-plugin': 24.0.1
  '@nx/js': 24.0.1
  '@nx/vitest': 24.0.1
  '@secretlint/secretlint-rule-preset-recommend': 13.0.7
  '@storybook/addon-a11y': 10.6.2
  '@storybook/addon-docs': 10.6.2
  '@storybook/addon-mcp': 10.6.2
  '@storybook/addon-vitest': 10.6.2
  '@storybook/react-vite': 10.6.2
  # Readability rules that Prettier leaves alone, such as blank lines between class members.
  '@stencil/core': 4.45.2
  '@stencil/eslint-plugin': 1.4.0
  '@stylistic/eslint-plugin': 5.10.0
  # The Node.js line of .nvmrc.
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
  chromatic: 18.14.0
  eslint: 10.12.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-simple-import-sort: 14.0.0
  eslint-plugin-storybook: 10.6.2
  imask: 7.6.1
  jsonc-eslint-parser: 3.3.0
  lefthook: 2.2.2
  nx: 24.0.1
  playwright: 1.64.1
  postcss-value-parser: 4.2.0
  prettier: 3.9.10
  publint: 0.3.25
  react: 19.3.1
  react-docgen-typescript: 2.4.0
  react-dom: 19.3.1
  secretlint: 13.0.7
  storybook: 10.6.2
  stylelint: 17.16.0
  stylelint-config-standard: 40.0.0
  stylelint-plugin-use-baseline: 1.4.8
  stylelint-use-logical: 2.1.3
  svgo: 4.1.0
  tailwindcss: 4.3.3
  # TypeScript 7 waits for typescript-eslint and Stencil, which need TypeScript 6.
  typescript: 6.0.3
  typescript-eslint: 8.71.2
  vite: 8.3.4
  vitest: 5.0.5
  vitest-browser-react: 2.3.0

# eslint-plugin-jsx-a11y has published no release since ESLint 10, and its rules run on it.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'

# Supply-chain protection: install only versions published at least a day ago.
minimumReleaseAge: 1440

# Dependencies allowed to run install scripts. Lefthook works without its own:
# the root `prepare` script installs its Git hooks.
onlyBuiltDependencies:
  - nx
ignoredBuiltDependencies:
  - esbuild
  - lefthook

# Preserve typed relative imports under NodeNext without changing IMask runtime code.
patchedDependencies:
  imask@7.6.1: patches/imask@7.6.1.patch

# Storybook 10.6 pins its docgen plugin to ^0.7.0, whose glob 13 and minimatch 10 carry
# GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249. The plugin only calls globSync, which glob 14
# keeps. Remove this once Storybook depends on a plugin with glob 14 or later.
overrides:
  '@joshwooding/vite-plugin-react-docgen-typescript>glob': 14.0.3
